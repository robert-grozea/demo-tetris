<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Demo Tetris</title>
    <link rel="stylesheet" href="src/styles.css">
  </head>
  <body>
    <main class="game-shell">
      <section class="play-area" aria-label="Tetris game">
        <canvas id="board" width="300" height="600" aria-label="Tetris board"></canvas>
      </section>

      <aside class="hud" aria-label="Game status">
        <h1>Tetris</h1>
        <div class="stat">
          <span>Score</span>
          <strong id="score">0</strong>
        </div>
        <div class="stat">
          <span>High Score</span>
          <strong id="high-score">0</strong>
        </div>
        <div class="stat">
          <span>Placed</span>
          <strong id="placed-blocks">0</strong>
        </div>
        <div class="stat">
          <span>Speed</span>
          <strong id="speed">1</strong>
        </div>
        <canvas id="next" width="120" height="120" aria-label="Next piece"></canvas>
        <button id="restart" type="button">Restart</button>
      </aside>
    </main>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
